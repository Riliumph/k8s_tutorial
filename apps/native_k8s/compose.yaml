services:
  k8s-master:
    build:
      dockerfile: node.dockerfile
    container_name: k8s-master
    hostname: k8s-master
    privileged: true
    tty: true
    stdin_open: true
    networks:
      k8s-net:
        ipv4_address: 172.20.0.10

  k8s-worker1:
    build:
      dockerfile: node.dockerfile
    container_name: k8s-worker1
    hostname: k8s-worker1
    privileged: true
    tty: true
    stdin_open: true
    networks:
      k8s-net:
        ipv4_address: 172.20.0.11

  k8s-worker2:
    build:
      dockerfile: node.dockerfile
    container_name: k8s-worker2
    hostname: k8s-worker2
    privileged: true
    tty: true
    stdin_open: true
    networks:
      k8s-net:
        ipv4_address: 172.20.0.12

networks:
  k8s-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
